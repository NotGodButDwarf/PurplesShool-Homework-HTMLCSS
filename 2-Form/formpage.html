<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styleformpage.css">
    <title>Simple Form</title>
</head>

<body>
    <main>
        <section class="main-section">
            <h1>Регистрация</h1>
            <div class="main-section-div">
                <span>Уже есть аккаунт?</span>
                <span><a href="#">Войти</a></span>
            </div>
            <form action="#" method="post" class="main-section-form">
                <input class="main-section-form-inputtext" type="text" name="company" placeholder="Моя компания">
                <div class="form-row">
                    <input class="main-section-form-inputtext" type="text" name="firstName" placeholder="Имя">
                    <input class="main-section-form-inputtext" type="text" name="lastName" placeholder="Фамилия">
                </div>
                <input class="main-section-form-inputtext" type="email" name="email" placeholder="E-mail">
                <button class="main-section-form-button" type="submit">Зарегистрироваться</button>
                <div class="form-row">
                    <input type="checkbox" name="agreement" id="agreement">
                    <label for="agreement">Я прочитал и принимаю <a href="#">Условия использования</a></label>
                </div>
            </form>
        </section>
    </main>
</body>

</html>
